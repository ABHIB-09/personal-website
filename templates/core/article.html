{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f2ee; --paper: #ffffff; --ink: #111113;
            --muted: #77767d; --blue: #5367e8; --blue-soft: #e8ebff;
            --black: #09090b; --line: rgba(17,17,19,.10); --max: 780px;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: var(--bg); color: var(--ink);
               font-family: "DM Sans", sans-serif; font-size: 16px; line-height: 1.6; }
        a { color: inherit; text-decoration: none; }

        /* NAV */
        .nav-wrap { position: fixed; top: 14px; left: 0; right: 0; z-index: 1000;
                    display: flex; justify-content: center; }
        .nav { display: flex; align-items: center; gap: 4px; padding: 6px;
               background: rgba(12,12,15,0.92); border: 1px solid rgba(255,255,255,0.14);
               border-radius: 999px; backdrop-filter: blur(24px); }
        .nav-logo { width: 36px; height: 36px; border-radius: 50%; display: grid;
                    place-items: center; color: #fff; font-family: "Manrope", sans-serif;
                    font-weight: 800; font-size: 13px;
                    background: radial-gradient(circle at 30% 25%, #fff 0%, #e8e4dc 18%,
                    #b0ada6 40%, #3a3a3e 70%, #0c0c0e 100%); }
        .nav-link { padding: 9px 15px; border-radius: 999px; color: rgba(255,255,255,0.58);
                    font-size: 13px; font-weight: 600; transition: all 0.2s ease; }
        .nav-link:hover { color: #fff; background: rgba(255,255,255,0.08); }

        /* HERO BANNER */
        .article-hero {
            padding: 120px 0 0;
            background: var(--black);
            color: #fff;
        }
        .article-hero .container {
            width: min(calc(100% - 48px), var(--max));
            margin: 0 auto;
            padding-bottom: 60px;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: rgba(255,255,255,0.55); font-size: 14px; font-weight: 600;
            margin-bottom: 32px; transition: color 0.2s ease;
        }
        .back-link:hover { color: #fff; }
        .article-category {
            display: inline-block; font-size: 11px; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: #b9b7ff; background: rgba(83,103,232,0.2);
            padding: 5px 14px; border-radius: 999px; margin-bottom: 20px;
        }
        .article-hero h1 {
            font-family: "Manrope", sans-serif;
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 700; letter-spacing: -0.04em;
            line-height: 1.1; margin: 0 0 24px;
        }
        .article-meta {
            display: flex; align-items: center; gap: 20px;
            color: rgba(255,255,255,0.5); font-size: 14px;
        }
        .article-meta span { display: flex; align-items: center; gap: 6px; }

        /* COVER IMAGE */
        .article-cover {
            width: min(calc(100% - 48px), 900px);
            margin: 0 auto;
            border-radius: 20px; overflow: hidden;
            margin-top: -20px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.2);
        }
        .article-cover img { width: 100%; height: 420px; object-fit: cover; display: block; }

        /* CONTENT */
        .article-body {
            width: min(calc(100% - 48px), var(--max));
            margin: 60px auto 100px;
        }
        .article-body h2 {
            font-family: "Manrope", sans-serif;
            font-size: 26px; font-weight: 700;
            letter-spacing: -0.03em; margin: 48px 0 16px;
        }
        .article-body p { font-size: 17px; line-height: 1.85; color: #2a2a2f; margin-bottom: 20px; }
        .article-body ul { padding-left: 0; list-style: none; margin: 20px 0; }
        .article-body ul li {
            position: relative; padding: 10px 0 10px 28px;
            border-bottom: 1px solid var(--line);
            font-size: 16px; line-height: 1.7; color: #2a2a2f;
        }
        .article-body ul li:last-child { border-bottom: none; }
        .article-body ul li::before {
            content: "→"; position: absolute; left: 0;
            color: var(--blue); font-weight: 700;
        }
        .article-body strong { color: var(--ink); font-weight: 700; }

        /* FOOTER */
        .back-footer {
            text-align: center; padding: 60px 24px;
            background: var(--black); color: rgba(255,255,255,0.6);
            font-size: 14px;
        }
        .back-footer a {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px; background: #fff; color: var(--black);
            border-radius: 999px; font-weight: 700; font-size: 14px;
            margin-bottom: 24px; transition: all 0.25s ease;
        }
        .back-footer a:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.15); }
    </style>
</head>
<body>

    <div class="nav-wrap">
        <nav class="nav">
            <a href="{% url 'core:home' %}" class="nav-logo">AB</a>
            <a href="{% url 'core:home' %}#hero"       class="nav-link">Home</a>
            <a href="{% url 'core:home' %}#about"      class="nav-link">About</a>
            <a href="{% url 'core:home' %}#projects"   class="nav-link">Work</a>
            <a href="{% url 'core:home' %}#experience" class="nav-link">Experience</a>
            <a href="{% url 'core:home' %}#insights"   class="nav-link active">Insights</a>
            <a href="{% url 'core:home' %}#contact"    class="nav-link">Contact</a>
        </nav>
    </div>

    <div class="article-hero">
        <div class="container">
            <a href="{% url 'core:home' %}#insights" class="back-link">← Back to Insights</a>
            <div class="article-category">{{ article.category }}</div>
            <h1>{{ article.title }}</h1>
            <div class="article-meta">
                <span>📅 {{ article.date }}</span>
                <span>⏱ {{ article.read_time }}</span>
            </div>
        </div>
    </div>

    <div class="article-cover">
        <img src="{% static article.image %}" alt="{{ article.title }}">
    </div>

    <div class="article-body">
        {{ article.content|safe }}
    </div>

    <div class="back-footer">
        <a href="{% url 'core:home' %}#insights">← Back to all articles</a>
        <p>© {% now "Y" %} Abhishek Bedake · AI / ML Engineer</p>
    </div>

</body>
</html>
